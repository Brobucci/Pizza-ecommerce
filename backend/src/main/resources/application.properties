spring.application.name=pizzeria-backend
spring.config.import=optional:file:.env[.properties]

spring.datasource.url=jdbc:mysql://localhost:3306/pizzadb?serverTimezone=UTC&useSSL=false&allowPublicKeyRetrieval=true
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
jwt.secret=${JWT_SECRET}

# Impostazioni JPA / Hibernate
# "validate" controlla che le Entity Java corrispondano perfettamente al DB senza modificarlo
spring.jpa.hibernate.ddl-auto=validate

# Mostra le query SQL generate da Hibernate nella console (utilissimo per capire cosa succede)
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

jwt.expiration-ms=900000

