spring.application.name=pizzeria-backend


spring.datasource.url=jdbc:mysql://localhost:3306/pizzadb?serverTimezone=UTC&useSSL=false
spring.datasource.username=root
spring.datasource.password=admin

# Impostazioni JPA / Hibernate
# "validate" controlla che le Entity Java corrispondano perfettamente al DB senza modificarlo
spring.jpa.hibernate.ddl-auto=validate

# Mostra le query SQL generate da Hibernate nella console (utilissimo per capire cosa succede)
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true